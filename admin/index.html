<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Live Battle Admin</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <span class="eyebrow">PAINEL ADMIN</span>
        <h1>Controle da batalha</h1>
        <p>Alterações são enviadas direto para a tela da live.</p>
      </div>
      <a class="open-live" href="../" target="_blank" rel="noopener">Abrir tela da live ↗</a>
    </header>

    <section class="admin-grid">
      <article class="panel settings-panel">
        <h2>Configuração</h2>
        <label class="field">Título da rodada<input id="titleInput" type="text" maxlength="60" /></label>
        <label class="field">Quantidade de participantes<select id="countSelect"><option>2</option><option>3</option><option>4</option></select></label>
        <label class="field">Rodada<input id="roundInput" type="number" min="1" max="999" /></label>
        <div class="button-row"><button id="resetVotes" class="danger" type="button">Zerar votos</button><button id="resetAll" type="button">Restaurar padrão</button></div>
      </article>

      <article class="panel">
        <div class="panel-head"><h2>Participantes</h2><span id="connectionStatus" class="status-dot">Sincronizado</span></div>
        <div id="participantEditors" class="participant-editors"></div>
      </article>

      <article class="panel">
        <h2>Presentes / valores</h2>
        <div id="giftEditors" class="gift-editors"></div>
      </article>
    </section>
  </main>

  <script type="module" src="../js/admin.js"></script>
</body>
</html>
