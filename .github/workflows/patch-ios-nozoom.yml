name: Corrigir zoom duplo no iPhone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ios-nozoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bloquear double-tap zoom no Safari iOS
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace(
              'content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"',
              'content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"'
          )

          marker = '/* iOS: bloquear zoom por double-tap sem quebrar os controles */'
          if marker not in html:
              css = '''\n    /* iOS: bloquear zoom por double-tap sem quebrar os controles */\n    html,body,#app,button,.action,.gift{touch-action:manipulation;}\n'''
              html = html.replace('</style>', css + '  </style>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit da correção
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige zoom duplo no Safari iOS"
          git push
