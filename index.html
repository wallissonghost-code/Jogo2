<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Live Battle Board</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05070d;color:#f7f8fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app-version{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));z-index:50;padding:5px 8px;border:1px solid #ffffff18;border-radius:999px;background:#060a12cc;color:#7f8da3;font-size:9px;font-weight:800;letter-spacing:.08em;pointer-events:none}
  </style>
</head>
<body class="live-page">
  <main class="live-shell">
    <header class="battle-topbar">
      <div class="live-brand">
        <span class="eyebrow">LIVE BATTLE BOARD</span>
        <h1 id="battleTitle">Batalha ao vivo</h1>
        <div id="universalStatus" class="universal-status" data-kind="">Carregando versão…</div>
      </div>
      <div class="live-header-actions">
        <button id="panelConnectButton" class="panel-connect-button" type="button">🔗 Conectar painel</button>
        <div class="round-badge">Rodada <span id="roundNumber">1</span></div>
      </div>
    </header>

    <section class="battle-stage">
      <div class="stage-glow stage-glow-red"></div>
      <div class="stage-glow stage-glow-blue"></div>
      <div class="battle-timer" id="battleTimer" aria-live="polite">
        <span>TEMPO RESTANTE</span>
        <strong id="battleTimerValue">03:00</strong>
      </div>
      <div class="versus-core" aria-hidden="true"><span>VS</span></div>
      <section id="battleGrid" class="battle-grid" aria-live="polite"></section>
      <aside id="livePlusBattleHud" class="lp-battle-hud" aria-live="polite" hidden></aside>
    </section>
  </main>

  <div class="panel-modal" id="panelModal" aria-hidden="true">
    <div class="panel-modal-card" role="dialog" aria-modal="true" aria-labelledby="panelModalTitle">
      <div class="panel-modal-head">
        <div><span class="eyebrow">LIVE+ UNIVERSAL</span><h2 id="panelModalTitle">Conectar ao painel Daniel</h2></div>
        <button id="closePanelModal" class="panel-modal-close" type="button" aria-label="Fechar">×</button>
      </div>
      <p>Digite o código de 8 caracteres gerado no Painel Universal.</p>
      <div class="pair-row">
        <input id="panelCode" class="pair-input" inputmode="text" autocomplete="off" maxlength="9" placeholder="ABCD-1234" />
        <button id="connectPanel" class="pair-button" type="button">CONECTAR</button>
      </div>
      <div class="pair-message" id="pairMessage">Aguardando código do painel.</div>
    </div>
  </div>

  <div class="app-version" id="appVersion">Beta0.0.5</div>
  <script src="./js/bootstrap.js"></script>
</body>
</html>
