<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cidade Viva — Beta 0.0.4</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="loading-screen">
    <div class="loading-brand">CIDADE VIVA</div>
    <div class="loading-version">BETA 0.0.4</div>
    <div class="loading-line"><span></span></div>
    <div class="loading-tip">Carregando cidade, NPCs e tráfego...</div>
  </div>

  <div id="landscape-shell">
    <div id="game"></div>

    <div id="hud">
      <div class="version-pill">Beta 0.0.4</div>

      <div class="brand-card">
        <strong>CIDADE VIVA</strong>
        <small id="status">A pé • Soco</small>
      </div>

      <div class="player-hud">
        <div id="weapon-hud" class="weapon-card"><span>👊</span><b id="weapon-name">Soco</b></div>
        <div class="stat money"><span>R$</span><b id="money">1.250</b></div>
        <div class="stat health"><span>VIDA</span><div class="bar"><i id="health-bar"></i></div></div>
      </div>

      <div id="npc-card" class="panel hidden">
        <div class="panel-title">MEMÓRIA DO NPC</div>
        <div id="npc-name">—</div>
        <div id="npc-state">—</div>
        <div id="npc-memory"></div>
      </div>

      <div id="prompt"></div>
      <div id="crosshair" class="hidden">+</div>
    </div>

    <div id="mobile-controls">
      <div id="joystick" class="joystick-zone">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>

      <div class="left-actions">
        <button id="action-run" class="round-action" aria-label="Correr">🏃</button>
        <button id="action-crouch" class="round-action" aria-label="Agachar">⬇</button>
      </div>

      <div class="right-actions">
        <button id="action-fire" class="main-action">SOCAR</button>
        <button id="action-weapon" class="round-action wide">ARMA</button>
        <button id="action-use" class="round-action wide">ENTRAR</button>
        <button id="action-memory" class="round-action wide subtle">MEMÓRIA</button>
      </div>

      <div id="car-controls" class="car-controls hidden">
        <div class="steer-row">
          <button data-drive="left">◀</button>
          <button data-drive="right">▶</button>
        </div>
        <div class="pedals">
          <button data-drive="brake">FREIO</button>
          <button data-drive="gas" class="gas">ACELERAR</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
