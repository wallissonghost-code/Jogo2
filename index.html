<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#05080c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Cidade Viva — Beta 0.1.5</title>
  <link rel="stylesheet" href="./styles014.css" />
</head>
<body>
  <div id="loading-screen"><div class="loading-brand">CIDADE VIVA</div><div class="loading-version">BETA 0.1.5</div><div class="loading-line"><span></span></div><div class="loading-tip">Carregando resgate, balística e física de impacto...</div></div>
  <div id="landscape-shell"><div id="game"></div>
    <div id="hud">
      <div class="version-pill">Beta 0.1.5</div>
      <div class="brand-card"><strong>CIDADE VIVA</strong><small id="status">A PÉ</small></div>
      <div class="player-hud"><div class="hud-card money"><span>DINHEIRO</span><b id="money">1.250</b></div><div class="hud-card"><span>VIDA <b id="health-value">100/100</b></span><div class="bar"><i id="health-bar"></i></div></div></div>
      <div id="ammo-hud" class="ammo-hud hidden"><span>PISTOLA</span><div><b id="ammo-mag">12</b><i>/</i><strong id="ammo-reserve">72</strong></div><small>CARREGADOR / RESERVA</small></div>
      <div id="vehicle-hud" class="vehicle-hud hidden"><div class="vehicle-speed"><span>VELOCIDADE</span><b id="vehicle-speed">0 km/h</b></div><div class="vehicle-meter"><span>INTEGRIDADE <b id="vehicle-health">100%</b></span><div class="vbar"><i id="vehicle-health-bar"></i></div></div><div class="vehicle-meter fuel"><span>COMBUSTÍVEL <b id="vehicle-fuel">100%</b></span><div class="vbar"><i id="vehicle-fuel-bar"></i></div></div></div>
      <div id="prompt"></div><div id="crosshair" class="hidden"></div>
    </div>
    <div id="mobile-controls">
      <div id="on-foot-controls">
        <div id="joystick" class="joystick-zone"><div class="joystick-ring"></div><div id="joystick-knob" class="joystick-knob"></div></div>
        <div class="left-actions"><button id="action-run" class="action">CORRER</button><button id="action-crouch" class="action">AGACHAR</button><button id="action-prone" class="action">DEITAR</button><button id="action-jump" class="action">PULAR</button></div>
        <button id="action-slot" class="slot-card"><span>EQUIPADO</span><b id="slot-name">SOCO</b></button>
        <div class="right-actions"><button id="action-fire" class="action main">GOLPE</button><button id="action-aim" class="action">MIRA</button><button id="action-reload" class="action">RECARREGAR</button><button id="action-bandage" class="action utility">CURAR</button><button id="action-use" class="action">ENTRAR</button><button id="action-slot-mobile" class="action" onclick="document.getElementById('action-slot').click()">TROCAR</button></div>
      </div>
      <div id="car-controls" class="car-controls hidden"><div class="steer-row"><button data-drive="left">◀</button><button data-drive="right">▶</button></div><div class="pedals"><button data-drive="brake" class="brake">FREIO</button><button data-drive="gas" class="gas">ACELERAR</button></div><button id="car-exit" class="car-exit">SAIR</button></div>
    </div>
  </div>
  <script type="module" src="./beta015.js"></script>
</body>
</html>
